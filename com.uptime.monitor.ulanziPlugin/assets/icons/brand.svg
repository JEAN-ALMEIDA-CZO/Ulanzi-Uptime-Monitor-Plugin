<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bgua" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1830"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="upbar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#16a34a"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="48" fill="url(#bgua)"/>
  <!-- status dot -->
  <circle cx="54" cy="58" r="10" fill="#22c55e"/>
  <circle cx="54" cy="58" r="18" fill="none" stroke="#22c55e" stroke-opacity="0.35" stroke-width="4"/>
  <!-- pulse / heartbeat line -->
  <path d="M40 132 H92 L108 96 L130 168 L150 120 L164 132 H216"
        fill="none" stroke="#22c55e" stroke-width="11"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- uptime bars -->
  <g>
    <rect x="48"  y="196" width="20" height="28" rx="4" fill="url(#upbar)"/>
    <rect x="78"  y="182" width="20" height="42" rx="4" fill="url(#upbar)"/>
    <rect x="108" y="200" width="20" height="24" rx="4" fill="url(#upbar)"/>
    <rect x="138" y="172" width="20" height="52" rx="4" fill="url(#upbar)"/>
    <rect x="168" y="208" width="20" height="16" rx="4" fill="#ef4444"/>
    <rect x="198" y="186" width="20" height="38" rx="4" fill="url(#upbar)"/>
  </g>
</svg>
